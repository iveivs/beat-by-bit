name: Validate pull request
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Install isolated browser-test tools
        run: npm install --no-save playwright@1.55.1 firebase-tools@14.0.0
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Browser smoke tests against local Firebase emulators
        timeout-minutes: 12
        env:
          VITE_FIREBASE_EMULATORS: "true"
          VITE_FIREBASE_API_KEY: "emulator-test-key"
          VITE_FIREBASE_AUTH_DOMAIN: "demo-beat-by-bit.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "demo-beat-by-bit"
        run: npx firebase emulators:exec --project demo-beat-by-bit --only auth,firestore --non-interactive "node tests/browser-data-safety.mjs"
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-data-safety-screenshots
          path: test-results/
          if-no-files-found: ignore
